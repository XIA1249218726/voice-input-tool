name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Windows / Python 3.12)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/requirements.txt

      - name: Compile check
        shell: pwsh
        run: python -m compileall -q main.py app tests

      - name: Unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
