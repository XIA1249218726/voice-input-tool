name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认使用的是最新 Release，并尽量附上日志。
        安全问题请勿在此公开，见 SECURITY.md。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 程序版本 / Release 标签
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: "Windows 11 23H2 / Windows 10 22H2"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - 安装程序
        - 便携版
        - 源码运行
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好
      placeholder: |
        1. 打开程序
        2. 按住 F8 说“测试”
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: |
        日志位置：%LOCALAPPDATA%\VoiceInputTool\logs\crash.log
        自检报告：%LOCALAPPDATA%\VoiceInputTool\logs\selftest.txt
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue
          required: true
        - label: 我使用的是最新版本
          required: true
        - label: 这不是安全问题（安全问题请走 SECURITY.md）
          required: true
